apiVersion: v1
kind: Secret

metadata:
  # name can be used to refer this secret
  name: postgres-secret

# Opaque is the general-purpose Secret type for key/value data.
type: Opaque

# stringData lets you write values as text.
# Kubernetes converts these values when it stores the Secret.
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: secret123