apiVersion: v1
kind: Service
metadata:
  # Name used by kubectl and by Minikube's service command.
  name: postgres-nodeport

spec:
  # Expose this Service through a port on the Kubernetes node.
  # Traffic path: client -> node:30432 -> Service:5432 -> PostgreSQL Pod:5432
  #
  # On Windows with Minikube's Docker driver, forward it to your host with:
  #   minikube service postgres-nodeport --url
  # Use the URL printed by that command in your database client.
  # Keep the command running while you connect; it maintains the tunnel.
  type: NodePort

  # Send traffic to Pods with this label.
  # It must match the StatefulSet Pod template's label.
  selector:
    app: postgres

  ports:
    - name: postgres
      protocol: TCP

      # Port exposed by this Service inside the cluster.
      port: 5432

      # Port PostgreSQL listens on inside the Pod.
      targetPort: 5432

      # Port opened on each Kubernetes node; valid default range: 30000–32767.
      nodePort: 30432