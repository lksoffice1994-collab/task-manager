apiVersion: v1
kind: Secret
metadata:
  name: task-service-secret
type: Opaque
stringData:
  # Must match the password for task_service_user in your PostgreSQL setup.
  DB_PASSWORD: pass123

  # Move the value of jwt.token.secret from TaskService's application.properties
  # here, then change that property to read from ${JWT_TOKEN_SECRET}.
  JWT_TOKEN_SECRET: