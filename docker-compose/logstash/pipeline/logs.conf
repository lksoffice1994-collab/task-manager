input {
  file {
    path => ["/logs/front/**/*.log", "/logs/front/*.log"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/front-sincedb"
    tags => ["front-service"]
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:level}\s+%{NUMBER:pid}\s+---\s+\[%{DATA:service_name}\]\s+\[%{DATA:thread}\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:log_message}"
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  date {
    match => ["log_timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    add_field => { "service" => "front-service" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-front-%{+YYYY.MM.dd}"
    data_stream => false
  }

  stdout {
    codec => rubydebug
  }
}