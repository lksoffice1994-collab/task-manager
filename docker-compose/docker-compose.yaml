version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: secret123
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  user-service:
    image: lksoffice1994/learning_proj-user_service:0.0.3.2
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PASSWORD: pass123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - user_logs:/var/log/user

  task-service:
    image: lksoffice1994/learning_proj-task_service:0.0.3.2
    container_name: task-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PASSWORD: pass123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - task_logs:/var/log/task

  front-service:
    image: lksoffice1994/learning_proj-front_service:0.0.3.2
    container_name: front-service
    ports:
      - "80:80"
    environment:
      TASK_SERVICE_HOST: task-service:8082
      USER_SERVICE_HOST: user-service:8081
    depends_on:
      - user-service
      - task-service
    restart: unless-stopped
    volumes:
      - front_logs:/var/log/front

volumes:
  postgres_data:
  front_logs:
  task_logs:
  user_logs:
