global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: front-service
    metrics_path: /front/actuator/prometheus
    static_configs:
      - targets: ["front-service:80"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: task-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["task-service:8082"]
