spring.application.name=FrontService

task.service.url=http://${TASK_SERVICE_HOST:localhost:8082}
user.service.url=http://${USER_SERVICE_HOST:localhost:8081}

# Exposing Health Metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

server.servlet.context-path=/front
server.port=80

# Log properties
logging.file.name=/var/log/front/front-service.log
logging.logback.rollingpolicy.file-name-pattern=/var/log/front/front-service.%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] trace_id=%X{trace_id:-} span_id=%X{span_id:-} %logger{36} - %msg%n