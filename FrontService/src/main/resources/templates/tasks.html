<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Task Calendar</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/task.css}">
</head>
<body>
<header class="header">
  <a class="header-title" th:href="@{/}">Learning</a>
  <nav class="header-links">
    <a th:href="@{/contact}">Contact Us</a>
<!--    <a th:href="@{/signup}">Sign Up</a>-->
<!--    <a th:href="@{/signin}">Sign In</a>-->
    <a th:href="@{/logout}">log out</a>
  </nav>
</header>
<div class="user-greeting" style="margin-top:12px; font-size:1.25em; font-weight:500;">
  Hello "<span th:text="${userId}"></span>", Your tasks are below
</div>

<main class="main-content">

  <div class="calendar">
    <form class="calendar-header" method="get" th:action="@{/tasks}" style="display: flex; gap: 0.5em; align-items: center; justify-content: center;"
     onsubmit="return setCalendarDateField(this)">
      <select id="calendar-month-select">
        <option th:value="1" th:selected="${selectedMonth == 1}">Jan</option>
        <option th:value="2" th:selected="${selectedMonth == 2}">Feb</option>
        <option th:value="3" th:selected="${selectedMonth == 3}">Mar</option>
        <option th:value="4" th:selected="${selectedMonth == 4}">Apr</option>
        <option th:value="5" th:selected="${selectedMonth == 5}">May</option>
        <option th:value="6" th:selected="${selectedMonth == 6}">Jun</option>
        <option th:value="7" th:selected="${selectedMonth == 7}">Jul</option>
        <option th:value="8" th:selected="${selectedMonth == 8}">Aug</option>
        <option th:value="9" th:selected="${selectedMonth == 9}">Sep</option>
        <option th:value="10" th:selected="${selectedMonth == 10}">Oct</option>
        <option th:value="11" th:selected="${selectedMonth == 11}">Nov</option>
        <option th:value="12" th:selected="${selectedMonth == 12}">Dec</option>
      </select>
      <select id="calendar-year-select">
        <option th:each="y : ${#numbers.sequence(selectedYear - 5, selectedYear + 5)}"
                th:value="${y}"
                th:text="${y}"
                th:selected="${selectedYear == y}">2025</option>
      </select>
      <input type="hidden" name="date" id="calendar-date-field" th:value="${selectedDate}"/>
      <input type="hidden" name="userId" th:value="${userId}" />
      <input type="hidden" name="jwt" th:value="${jwtToken}" />
      <button type="submit" style="padding:0 1em;">Go</button>
    </form>
    <script>
      function setCalendarDateField(form) {
        var month = form.querySelector('#calendar-month-select').value;
        var year = form.querySelector('#calendar-year-select').value;
        var monthStr = (month.length === 1 ? '0' + month : month);
        var date = year + '-' + monthStr + '-01';
        form.querySelector('#calendar-date-field').value = date;
        return true;
      }
    </script>
    <div class="calendar-grid-header" style="display: grid; grid-template-columns: repeat(7, 2em); gap: 0.3em; margin-bottom: 0.2em;">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 2em); gap: 0.3em;">
      <th:block th:each="day,iter : ${calendarDays}">
        <div class="calendar-day"
             th:classappend="${day.selected} ? 'selected' : ''"
             th:text="${day.dayOfMonth}"
             th:attr="data-date=${day.date}"
             onclick="onCalendarDayClick(this)">
        </div>
      </th:block>
    </div>
  </div>

  <!-- Ticket Table -->
  <h2 style="margin-top:2em;">Tickets</h2>
  <table class="ticket-table">
    <thead>
      <tr>
        <th>Sr No</th>
        <th>Summary</th>
        <th>Description</th>
        <th>Status</th>
        <th>Update</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="task, iter : ${tasks}">
        <form th:action="@{'/tasks/' + ${task.id}}" method="post">
          <td th:text="${iter.index + 1}"></td>
          <td><input type="text" name="summary" th:value="${task.summary}" required/></td>
          <td><input type="text" name="description" th:value="${task.description}" required/></td>
          <td>
            <select name="status" required>
              <option th:value="NotStarted" th:selected="${task.status == 'NotStarted'}">NotStarted</option>
              <option th:value="InProgress" th:selected="${task.status == 'InProgress'}">InProgress</option>
              <option th:value="Done" th:selected="${task.status == 'Done'}">Done</option>
            </select>
          </td>
          <td>
            <input type="hidden" name="date" th:value="${selectedDate}"/>
            <input type="hidden" name="jwt" th:value="${jwtToken}"/>
            <input type="hidden" name="userId" th:value="${userId}"/>
            <button type="submit">Update</button>
          </td>
        </form>
      </tr>
      <!-- Add Task blank row -->
      <tr class="ticket-add-row">
        <form th:action="@{/tasks}" method="post">
          <td th:text="${#lists.isEmpty(tasks) ? 1 : tasks.size() + 1}"></td>
          <td><input type="text" name="summary" placeholder="Summary" required/></td>
          <td><input type="text" name="description" placeholder="Description" required/></td>
          <td>
            <select name="status" required>
              <option th:value="NotStarted">NotStarted</option>
              <option th:value="InProgress">InProgress</option>
              <option th:value="Done">Done</option>
            </select>
          </td>
          <td>
            <input type="hidden" name="date" th:value="${selectedDate}"/>
            <input type="hidden" name="jwt" th:value="${jwtToken}"/>
            <input type="hidden" name="userId" th:value="${userId}"/>
            <button type="submit">Add</button>
          </td>
        </form>
      </tr>
    </tbody>
  </table>
</main>
<footer class="footer">
  <a th:href="@{/privacy}">Privacy Policy</a> |
  <a th:href="@{/terms}">Terms of Use</a> |
  <a th:href="@{/accessibility}">Accessibility</a>
</footer>
<script src="/js/script.js"></script>
<script>
  function onCalendarDayClick(el) {
    var date = el.dataset.date;
    var userIdEl = document.querySelector('input[name="userId"]');
    var jwtEl = document.querySelector('input[name="jwt"]');
    var userId = userIdEl ? userIdEl.value : '';
    var jwt = jwtEl ? jwtEl.value : '';
    if (date) {
      window.location.href = '/tasks?date=' + date + '&userId=' + encodeURIComponent(userId) + '&jwt=' + encodeURIComponent(jwt);
    }
  }
</script>
</body>
</html>
