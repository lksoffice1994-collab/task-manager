# Kubernetes API version for a Secret.
apiVersion: v1

# A Secret stores sensitive values, such as passwords.
kind: Secret

metadata:
  # The Deployment refers to this Secret by name.
  name: user-service-secret

# Opaque is the general-purpose Secret type for key/value data.
type: Opaque

# stringData allows values to be written as plain text in this file.
# Kubernetes converts them when storing the Secret.
stringData:
  DB_PASSWORD: pass123
  JWT_TOKEN_SECRET: Xn7eHRM3LKdCq9PVGwzAxf2QcuER0s58bhmFyUZikJKAVgpwTY1OrN6XljDSQW4v