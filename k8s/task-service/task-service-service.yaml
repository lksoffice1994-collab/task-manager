apiVersion: v1
kind: Service
metadata:
  name: task-service
spec:
  # Makes the service reachable from other pods in the cluster.
  type: ClusterIP

  # Sends traffic to TaskService pods with this label.
  selector:
    app: task-service

  ports:
    - name: http
      # Port other cluster workloads use to reach this Service.
      port: 8082
      # Port TaskService listens on inside its pod.
      targetPort: 8082
      protocol: TCP