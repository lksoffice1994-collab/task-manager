apiVersion: v1
kind: ConfigMap
metadata:
  name: front-service-config
data:
  # URL used by the browser-facing frontend to reach TaskService.
  # This value is suitable only if the frontend makes requests from inside the cluster.
  TASK_SERVICE_HOST: "task-service.task-service.svc.cluster.local:8082"
  USER_SERVICE_HOST: "user-service.user-service.svc.cluster.local:8081"