apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig


metadata:
  name: task-man-cluster
  region: ap-southeast-2
  version: "1.36"

iam:
  withOIDC: false

addons:
  - name: eks-pod-identity-agent

managedNodeGroups:
  - name: task-man-cluster
    instanceType: t3.large
    minSize: 1
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 30
    volumeType: gp3
    privateNetworking: false
    iam:
      withAddonPolicies:
        ebs: true
        cloudWatch: true
        awsLoadBalancerController: true