spring.application.name=TaskService

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/postgres?currentSchema=task_service
spring.datasource.username=task_service_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema=task_service


# Tell JPA to use existing schema (Liquibase will do schema management)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Liquibase if you?re not using changelog files
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.changeset/master.changelog.xml
spring.liquibase.default-schema=task_service

server.port=8082

jwt.token.secret=Xn7eHRM3LKdCq9PVGwzAxf2QcuER0s58bhmFyUZikJKAVgpwTY1OrN6XljDSQW4v


## logging properties

logging.file.name=/var/log/task/task-service.log
logging.logback.rollingpolicy.file-name-pattern=/var/log/task/task-service.%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service.name=task-service [%thread] trace_id=%X{trace_id:-} span_id=%X{span_id:-} %logger{36} - %msg%n
