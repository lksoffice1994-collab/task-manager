#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
#spring.datasource.username=postgres
#spring.datasource.password=secret123

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/postgres?currentSchema=user_service
spring.datasource.username=user_service_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema=user_service
#spring.liquibase.default-schema=user_service

# Tell JPA to use existing schema (Liquibase will do schema management)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase changelog configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=user_service

jwt.token.secret=${JWT_TOKEN_SECRET:Xn7eHRM3LKdCq9PVGwzAxf2QcuER0s58bhmFyUZikJKAVgpwTY1OrN6XljDSQW4v}
jwt.expiration=3600000

server.port=8081

aws.region=${AWS_REGION}
aws.sns.notification-topic-arn=${SNS_NOTIFICATION_TOPIC_ARN}
otp.cache.enabled=${OTP_CACHE_ENABLED:false}
valkey.host=${VALKEY_HOST}
valkey.port=${VALKEY_PORT:6379}
valkey.password=${VALKEY_PASSWORD}