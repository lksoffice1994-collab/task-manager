spring.application.name=UserService

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/postgres?currentSchema=user_service
spring.datasource.username=user_service_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema=user_service
#spring.liquibase.default-schema=user_service

# Tell JPA to use existing schema (Liquibase will do schema management)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase changelog configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=user_service

jwt.token.secret=Xn7eHRM3LKdCq9PVGwzAxf2QcuER0s58bhmFyUZikJKAVgpwTY1OrN6XljDSQW4v
jwt.expiration=3600000

server.port=8081

# Exposing Health Metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

## logging properties
logging.file.name=/var/log/user/user-service.log
logging.logback.rollingpolicy.file-name-pattern=/var/log/user/user-service.%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service.name=user-service [%thread] trace_id=%X{trace_id:-} span_id=%X{span_id:-} %logger{36} - %msg%n
