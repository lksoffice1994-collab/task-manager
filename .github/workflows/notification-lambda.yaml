name: Deploy Notification Lambda

on:
  push:
    branches:
      - master
    paths:
      - "NotificationLambdaService/**"
      - ".github/workflows/notification-lambda.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: notification-lambda
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAMBDA_ARTIFACT_BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}
      LAMBDA_SUBNET_IDS: ${{ vars.LAMBDA_SUBNET_IDS }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambda JAR
        run: ./mvnw --batch-mode -f NotificationLambdaService/pom.xml clean package -DskipTests

      - name: Upload JAR to S3
        run: |
          ARTIFACT_KEY="NotificationLambdaService/${GITHUB_SHA}/NotificationLambdaService-0.0.3.jar"
          echo "ARTIFACT_KEY=$ARTIFACT_KEY" >> "$GITHUB_ENV"
          aws s3 cp \
            NotificationLambdaService/target/NotificationLambdaService-0.0.3.jar \
            "s3://${LAMBDA_ARTIFACT_BUCKET}/${ARTIFACT_KEY}"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file NotificationLambdaService/template.yaml \
            --stack-name notification-lambda \
            --role-arn arn:aws:iam::978841975360:role/NotificationLambdaCloudFormationRole \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "LambdaSubnetIds=${LAMBDA_SUBNET_IDS}" \
              "LambdaArtifactBucket=${LAMBDA_ARTIFACT_BUCKET}" \
              "LambdaArtifactKey=${ARTIFACT_KEY}" \
              "ResendApiKey=${RESEND_API_KEY}" \
              "VpcId=vpc-0a58ad9fd02686441"