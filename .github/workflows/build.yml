name: Build task-manager

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      front_service:
        description: FrontService
        type: choice
        options:
          - Run
          - Skip
        default: Run
        required: true
      user_service:
        description: UserService
        type: choice
        options:
          - Run
          - Skip
        default: Run
        required: true
      task_service:
        description: TaskService
        type: choice
        options:
          - Run
          - Skip
        default: Run
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and push FrontService
        if: ${{ github.event_name == 'push' || inputs.front_service == 'Run' }}
        run: >
          mvn --batch-mode -pl FrontService compile jib:build
          -Djib.to.auth.username="$DOCKERHUB_USERNAME"
          -Djib.to.auth.password="$DOCKERHUB_TOKEN"

      - name: Build and push UserService
        if: ${{ github.event_name == 'push' || inputs.user_service == 'Run' }}
        run: >
          mvn --batch-mode -pl UserService compile jib:build
          -Djib.to.auth.username="$DOCKERHUB_USERNAME"
          -Djib.to.auth.password="$DOCKERHUB_TOKEN"

      - name: Build and push TaskService
        if: ${{ github.event_name == 'push' || inputs.task_service == 'Run' }}
        run: >
          mvn --batch-mode -pl TaskService compile jib:build
          -Djib.to.auth.username="$DOCKERHUB_USERNAME"
          -Djib.to.auth.password="$DOCKERHUB_TOKEN"

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add EC2 host key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy Compose folder to EC2
        env:
          SSHPASS: ${{ secrets.EC2_APPUSER_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=yes -r \
            ./docker-compose \
            "$EC2_USER@$EC2_HOST:/home/appUser/deploy-tmp/"

      - name: Deploy on EC2
        env:
          SSHPASS: ${{ secrets.EC2_APPUSER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" '
            if [ -f /opt/apps/task-manager/docker-compose/docker-compose.yml ]; then
              docker compose \
                -f /opt/apps/task-manager/docker-compose/docker-compose.yml \
                --project-directory /opt/apps/task-manager down
            fi

            mkdir -p /opt/apps/task-manager/docker-compose
            cp -a /home/appUser/deploy-tmp/docker-compose/. \
              /opt/apps/task-manager/docker-compose/

            docker compose \
              -f /opt/apps/task-manager/docker-compose/docker-compose.yml \
              --project-directory /opt/apps/task-manager pull &&
            docker compose \
              -f /opt/apps/task-manager/docker-compose/docker-compose.yml \
              --project-directory /opt/apps/task-manager up -d
          '