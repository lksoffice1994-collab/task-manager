name: Build task-manager

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all Maven modules
        run: mvn --batch-mode clean install

      - name: Build and push service images with Jib to Docker Hub
        run: >
          mvn --batch-mode
          -pl FrontService,UserService,TaskService
          -Djib.to.auth.username="${{ vars.DOCKERHUB_USERNAME }}"
          -Djib.to.auth.password="${{ secrets.DOCKERHUB_TOKEN }}"
          jib:build
